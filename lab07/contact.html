<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tier List Evaluation Form</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <nav>
        <a href="tierlist.html">Tier List</a>
        <a href="contact.html">Feedback Form</a>
    </nav>

    <main>
        <h1>Tier List Feedback & Evaluation</h1>
        <p>Do you disagree with my Fast and Furious movie rankings? Fill out this form to let me know what I got
            wrong.</p>

        <form action="#" method="POST">


            <div class="form-group">
                <label for="userName">Full Name:</label>
                <input type="text" id="userName" name="userName" required placeholder="Jane Doe">
            </div>


            <div class="form-group">
                <label for="userEmail">Email Address:</label>
                <input type="email" id="userEmail" name="userEmail" required placeholder="jane.doe@example.com">
            </div>


            <div class="form-group">
                <label for="primaryDisagreement">Which movie did we rank incorrectly?</label>
                <select id="primaryDisagreement" name="primaryDisagreement">
                    <option value="none">-- Select Movie --</option>
                    <option value="F&F1">The Fast and The Furious</option>
                    <option value="F&F2">2 Fast 2 Furious</option>
                    <option value="F&F3">Fast and Furious: Tokyo Drift</option>
                    <option value="F&F4">The Fast and The Furious</option>
                    <option value="F&F5">Fast Five</option>
                </select>
            </div>


            <div class="form-group">
                <label>Should 2 Fast 2 Furious move up to S-Tier</label>
                <div class="radio-group">
                    <label><input type="radio" name="jsUpgrade" value="yes"> Yes, absolutely</label>
                    <label><input type="radio" name="jsUpgrade" value="no"> No, keep it in A-Tier</label>
                    <label><input type="radio" name="jsUpgrade" value="unsure"> Neutral/Unsure</label>
                </div>
            </div>


            <div class="form-group">
                <label>Which criteria should weigh heavier in next iteration? (Select all that apply)</label>
                <div class="checkbox-group">
                    <label><input type="checkbox" name="criteria" value="realism"> Realism</label>
                    <label><input type="checkbox" name="criteria" value="carselection"> Car Selection</label>
                    <label><input type="checkbox" name="criteria" value="story">Story</label>
                </div>
            </div>


            <div class="form-group">
                <label for="userComments">Justify your movie re-ranking or add general feedback:</label>
                <textarea id="userComments" name="userComments"
                    placeholder="Provide details on why you would alter this list..."></textarea>
            </div>


            <button type="submit">Submit Tier Recommendations</button>

        </form>
    </main>

</body>

</html>
